name: Production smoke

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TASKFLOW_BASE_URL: ${{ inputs.base_url || vars.TASKFLOW_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify configured URL
        shell: bash
        run: test -n "$TASKFLOW_BASE_URL"
      - name: Smoke test production
        run: pnpm smoke
